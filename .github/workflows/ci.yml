name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test Kotlin and Compose SDKs
        run: >-
          ./gradlew clean test
          :app-agent-ui-compose:assembleRelease
          :app-agent-inspector:assembleRelease
          :app-agent-inspector-noop:assembleRelease
          :app-agent-inspector:lintDebug
          :app-agent-inspector-noop:lintRelease
          --no-daemon

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Lint TypeScript
        run: npm run lint

      - name: Test TypeScript packages and example
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:check

  android-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build weather example
        working-directory: examples/weather-agent/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Build native trading example
        working-directory: examples/trading-agent/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon

      - name: Build UiAutomator2 companion
        run: >-
          examples/weather-agent/android/gradlew
          -p drivers/android-uiautomator2
          :host:assembleDebug
          :host:assembleDebugAndroidTest
          --no-daemon
